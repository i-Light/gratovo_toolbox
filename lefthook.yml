# Git hooks, installed by `pnpm install` (the prepare script). They check only the staged files.
pre-commit:
  parallel: true
  commands:
    prettier:
      glob: "*.{ts,tsx,js,mjs,json,css,yml,yaml}"
      run: pnpm exec prettier --check --ignore-unknown {staged_files}
    eslint:
      glob: "*.{ts,tsx,mjs}"
      run: pnpm exec eslint {staged_files}
    ruff:
      glob: "services/pipeline/**/*.py"
      root: "services/pipeline/"
      run: uv run ruff check {staged_files} && uv run ruff format --check {staged_files}
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks git --staged --redact --no-banner
        else
          echo "gitleaks is not installed on this machine, so the secret scan is skipped here. CI runs it on every pull request."
        fi
