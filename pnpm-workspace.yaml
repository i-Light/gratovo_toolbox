packages:
  - apps/*
  - packages/*
  - tooling/*
  - services/gemini-extension

# pnpm 12 reads its settings from this file. It ignores them in .npmrc.
saveExact: true
engineStrict: true

# Don't install a version until it has been public for a day, so a hijacked release
# is usually pulled before it reaches us.
minimumReleaseAge: 1440

# Install scripts run only for the packages listed here.
# lefthook's script installs the git hooks (it skips itself in CI).
allowBuilds:
  lefthook: true

# eslint-plugin-jsx-a11y 6.10.2 has not widened its peer range to ESLint 10 yet.
# Its rules were checked to work under ESLint 10; see docs/decisions/0007-toolchain-pins.md.
peerDependencyRules:
  allowedVersions:
    eslint-plugin-jsx-a11y>eslint: "10"

# minimatch before 11.0.1 can be made to hang by a crafted pattern (GHSA-g3hv-75wg-m249, 2026-10-30).
# The fix exists only in 11. ESLint's copy (10.x) moves to it. eslint-plugin-jsx-a11y's copy (3.x)
# can't: the plugin calls 3.x's default export, which 11 doesn't have. That one is accepted in
# osv-scanner.toml, with the reason.
overrides:
  minimatch@^10: 11.0.3
