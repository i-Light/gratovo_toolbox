<title>Gratovo App Prototypes</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: a sticky switcher bar over one stage. "Compare" is a reading page; A, B and C are full app frames (rail + work area) in the Gratovo app's own palette, so only the workflow differs. */
:root{
  --bg:#eef4fa; --surface:#ffffff; --surface-2:#e6eef6; --surface-3:#dae6f1; --line:#d0dde9; --ink:#0a2a47; --ink-2:#3b5268; --muted:#5f6b7a;
  --primary:#0079ba; --primary-ink:#ffffff; --primary-soft:#d3e9f8; --rose:#d8203f; --rose-soft:#fbe2e7; --magenta:#b8329e; --magenta-soft:#f4e0ee;
  --good:#17803a; --good-soft:#ddf2e3; --warn:#9a5c00; --warn-soft:#fbecd2; --crit:#c7281a; --crit-soft:#fbe1dd;
  --shadow:0 10px 30px rgba(10,42,71,.14);
  --f-ui:"Cairo","Segoe UI",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#06141e; --surface:#0d2333; --surface-2:#132f44; --surface-3:#1a3b54; --line:#28506d; --ink:#e4f0fa; --ink-2:#aec2d6; --muted:#8aa2b8;
    --primary:#4cb6ef; --primary-ink:#04131d; --primary-soft:#123e5a; --rose:#fb6f8b; --rose-soft:#3b1826; --magenta:#da7bc8; --magenta-soft:#36193a;
    --good:#5fd283; --good-soft:#123522; --warn:#f2b84b; --warn-soft:#3a2b0c; --crit:#ef7d70; --crit-soft:#3e1712;
    --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#06141e; --surface:#0d2333; --surface-2:#132f44; --surface-3:#1a3b54; --line:#28506d; --ink:#e4f0fa; --ink-2:#aec2d6; --muted:#8aa2b8;
  --primary:#4cb6ef; --primary-ink:#04131d; --primary-soft:#123e5a; --rose:#fb6f8b; --rose-soft:#3b1826; --magenta:#da7bc8; --magenta-soft:#36193a;
  --good:#5fd283; --good-soft:#123522; --warn:#f2b84b; --warn-soft:#3a2b0c; --crit:#ef7d70; --crit-soft:#3e1712;
  --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg); color:var(--ink); font:400 14.5px/1.5 var(--f-ui); -webkit-font-smoothing:antialiased}
body::before{content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:50; background:var(--surface)}
button,input,select,textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--primary); outline-offset:2px; border-radius:6px}
h1,h2,h3,h4{margin:0; text-wrap:balance; line-height:1.2}
p{margin:0}
.mono{font-family:var(--f-mono); font-size:.88em}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* switcher bar */
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:40; background:var(--surface); border-bottom:1px solid var(--line)}
.top-in{display:flex; align-items:center; gap:14px; padding-block:8px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); overflow-x:auto; scrollbar-width:none}
.top-in::-webkit-scrollbar{display:none}
.logo{display:flex; align-items:center; gap:8px; font-weight:800; white-space:nowrap}
.logo i{width:22px; height:22px; border-radius:7px; background:linear-gradient(135deg,var(--primary),var(--magenta)); display:inline-block}
.vt{display:flex; gap:4px; background:var(--surface-2); padding:3px; border-radius:10px}
.vt button{border:0; background:transparent; padding:6px 12px; border-radius:8px; font-weight:600; font-size:13.5px; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.vt button[aria-current="true"]{background:var(--surface); color:var(--ink); box-shadow:0 1px 3px rgba(10,42,71,.15)}
.vt button b{font-family:var(--f-mono); color:var(--primary); margin-right:4px}
.top .ex{font-size:12px; color:var(--muted); white-space:nowrap; margin-left:auto}
.top .tourbtn{white-space:nowrap}

/* generic controls */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink); border-radius:9px; padding:7px 12px; font-weight:600; font-size:13.5px; cursor:pointer; white-space:nowrap; min-height:34px}
.btn:hover{border-color:var(--primary)}
.btn.pri{background:var(--primary); color:var(--primary-ink); border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px; min-height:28px; font-size:12.5px; border-radius:7px}
.btn:disabled{opacity:.45; cursor:not-allowed; filter:none}
.chip{display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--surface); border-radius:999px; padding:4px 11px; font-size:12.5px; font-weight:600; color:var(--ink-2); cursor:pointer; white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink); color:var(--surface); border-color:var(--ink)}
.chip .c{font-family:var(--f-mono); font-size:11px; opacity:.8}
.tag{display:inline-flex; align-items:center; gap:5px; font-size:11.5px; font-weight:700; padding:2px 8px; border-radius:6px; background:var(--surface-2); color:var(--ink-2); white-space:nowrap}
.tag.good{background:var(--good-soft); color:var(--good)} .tag.warn{background:var(--warn-soft); color:var(--warn)} .tag.crit{background:var(--crit-soft); color:var(--crit)}
.tag.pri{background:var(--primary-soft); color:var(--ink)} .tag.mag{background:var(--magenta-soft); color:var(--ink)}
.kbd{font:600 11px var(--f-mono); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:0 5px; color:var(--ink-2); background:var(--surface)}
.field{display:flex; flex-direction:column; gap:4px; font-size:12.5px; font-weight:600; color:var(--ink-2)}
.input, select.input, textarea.input{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:7px 10px; font-size:14px; font-weight:400; color:var(--ink); min-width:0; width:100%}
textarea.input{resize:vertical; min-height:70px; line-height:1.5}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
.col{display:flex; flex-direction:column; gap:8px; min-width:0}
.sp{flex:1}

/* the app frame used by all three versions */
.stage{min-height:calc(100% - 52px)}
.app{display:grid; grid-template-columns:auto minmax(0,1fr); min-height:calc(100vh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); background:var(--bg)}
.rail{background:var(--surface); border-right:1px solid var(--line); display:flex; flex-direction:column; gap:2px; padding:12px 8px; width:200px; position:sticky; top:52px; align-self:start; height:calc(100vh - 52px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); overflow-y:auto}
.rail .rh{font:700 11px var(--f-mono); text-transform:uppercase; letter-spacing:.08em; color:var(--muted); padding:10px 10px 4px}
.ri{display:flex; align-items:center; gap:10px; border:0; background:transparent; text-align:left; padding:8px 10px; border-radius:9px; font-weight:600; color:var(--ink-2); cursor:pointer; width:100%}
.ri:hover{background:var(--surface-2)}
.ri[aria-current="true"]{background:var(--primary-soft); color:var(--ink)}
.ri .ic{width:22px; height:22px; border-radius:6px; display:grid; place-items:center; font:700 11px var(--f-mono); background:var(--surface-2); color:var(--ink-2); flex:none}
.ri[aria-current="true"] .ic{background:var(--primary); color:var(--primary-ink)}
.ri .cnt{margin-left:auto; font:600 11.5px var(--f-mono); background:var(--rose); color:#fff; border-radius:999px; padding:0 7px; line-height:18px}
.ri .cnt.q{background:var(--surface-3); color:var(--ink-2)}
.ri .sub{display:block; font-size:11.5px; font-weight:400; color:var(--muted); line-height:1.25}
.rail .grow{flex:1}
.work{min-width:0; display:flex; flex-direction:column}
.bar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; padding:10px 18px; background:var(--surface); border-bottom:1px solid var(--line); position:sticky; top:52px; z-index:20}
.search{display:flex; align-items:center; gap:8px; border:1px solid var(--line); background:var(--surface-2); border-radius:9px; padding:6px 10px; min-width:200px; flex:0 1 320px; cursor:text; color:var(--muted); font-size:13.5px}
.status{display:flex; gap:6px; flex-wrap:wrap}
.st{display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--ink-2); border:1px solid var(--line); border-radius:999px; padding:3px 9px; background:var(--surface); white-space:nowrap}
.st i{width:8px; height:8px; border-radius:50%; background:var(--good); display:inline-block}
.st.warn i{background:var(--warn)} .st.crit i{background:var(--crit)}
.page{padding:18px 18px 140px; display:flex; flex-direction:column; gap:16px; min-width:0}
.ph{display:flex; align-items:flex-end; gap:12px; flex-wrap:wrap}
.ph h2{font-size:1.45rem; font-weight:800}
.ph p{color:var(--ink-2)}
.tabs{display:flex; gap:2px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none}
.tabs button{border:0; background:transparent; padding:9px 14px; font-weight:700; color:var(--muted); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap; display:flex; gap:7px; align-items:center}
.tabs button[aria-current="true"]{color:var(--ink); border-bottom-color:var(--primary)}
.tabs .c{font:600 11px var(--f-mono); background:var(--surface-2); border-radius:999px; padding:0 7px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px 16px; display:flex; flex-direction:column; gap:10px; min-width:0}
.card h3{font-size:1.02rem; font-weight:800}
.hint{font-size:12.5px; color:var(--muted)}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.kv{display:grid; grid-template-columns:auto minmax(0,1fr); gap:4px 14px; font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0; font-weight:600}

/* tables */
.tw{overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:12px}
table{border-collapse:collapse; width:100%; font-size:13.5px}
th,td{padding:9px 12px; text-align:left; border-bottom:1px solid var(--line); vertical-align:middle; white-space:nowrap}
th{font:700 11px var(--f-mono); text-transform:uppercase; letter-spacing:.06em; color:var(--muted); background:var(--surface-2)}
tr:last-child td{border-bottom:0}
tbody tr{cursor:pointer}
tbody tr:hover td{background:var(--surface-2)}
tr.sel td{background:var(--primary-soft)}
td.who b{display:block; font-weight:700} td.who span{font-size:12px; color:var(--muted)}
input[type=checkbox]{width:16px; height:16px; accent-color:var(--primary)}
.av{width:30px; height:30px; border-radius:50%; display:inline-grid; place-items:center; font:700 12px var(--f-ui); color:#fff; flex:none}

/* bulk bar */
.bulk{position:sticky; bottom:calc(12px + env(safe-area-inset-bottom,0px)); z-index:15; align-self:center; display:flex; gap:8px; align-items:center; flex-wrap:wrap; background:var(--ink); color:var(--surface); border-radius:12px; padding:8px 10px 8px 14px; box-shadow:var(--shadow)}
.bulk .btn{background:var(--surface); color:var(--ink); border-color:transparent}
.bulk .btn.pri{background:var(--primary); color:var(--primary-ink)}

/* kanban */
.board{display:grid; grid-auto-flow:column; grid-auto-columns:minmax(230px,1fr); gap:12px; overflow-x:auto; padding-bottom:6px}
.lane{background:var(--surface-2); border-radius:12px; padding:10px; display:flex; flex-direction:column; gap:8px; min-width:0; align-self:start}
.lane h4{font-size:13px; font-weight:800; display:flex; gap:8px; align-items:center}
.lane h4 .c{font:600 11px var(--f-mono); color:var(--muted)}
.lane .lh{font-size:11.5px; color:var(--muted); margin-top:-4px}
.kc{background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:6px; cursor:pointer; text-align:left; width:100%}
.kc:hover{border-color:var(--primary)}
.kc b{font-size:13.5px}
.kc .m{font-size:12px; color:var(--muted)}
.kc .nx{font-size:12px; font-weight:700; color:var(--primary)}
.lane .empty{font-size:12.5px; color:var(--muted); padding:8px 4px}

/* drawer */
.scrim{position:fixed; inset:0; background:rgba(4,15,23,.42); z-index:60}
.drawer{position:fixed; top:0; right:0; bottom:0; width:min(640px,100vw); background:var(--bg); z-index:61; display:flex; flex-direction:column; box-shadow:var(--shadow); padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); padding-right:env(safe-area-inset-right,0px)}
.drawer-h{display:flex; gap:12px; align-items:center; padding:14px 16px; background:var(--surface); border-bottom:1px solid var(--line)}
.drawer-b{overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:14px}

/* journey bar */
.journey{display:flex; gap:3px; overflow-x:auto; scrollbar-width:none}
.journey span{flex:1 0 auto; min-width:64px; font-size:11px; font-weight:700; text-align:center; padding:5px 6px 4px; background:var(--surface-2); color:var(--muted); position:relative; white-space:nowrap}
.journey span:first-child{border-radius:8px 0 0 8px} .journey span:last-child{border-radius:0 8px 8px 0}
.journey span.done{background:var(--good-soft); color:var(--good)}
.journey span.now{background:var(--primary); color:var(--primary-ink)}

/* draft card */
.msg{border-radius:12px; padding:10px 12px; font-size:14px; max-width:92%; white-space:pre-wrap}
.msg.in{background:var(--surface-2); align-self:flex-start; border-top-left-radius:4px}
.msg.out{background:var(--primary-soft); align-self:flex-end; border-top-right-radius:4px}
.msg small{display:block; font:500 11px var(--f-mono); color:var(--muted); margin-bottom:3px}
.thread{display:flex; flex-direction:column; gap:8px}
.draft{background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:14px; display:flex; flex-direction:column; gap:10px}
.draft .why{font-size:13px; color:var(--ink-2); background:var(--surface-2); border-radius:8px; padding:7px 10px}
.draft .subj{font-weight:800}
.draft .body{white-space:pre-wrap; font-size:14px; line-height:1.6; border-radius:8px; padding:2px 0}
.draft .body[contenteditable="true"], .draft .subj[contenteditable="true"]{outline:2px dashed var(--primary); outline-offset:4px; padding:4px}
.gate{display:flex; gap:8px; align-items:flex-start; font-size:13px; background:var(--warn-soft); border-radius:8px; padding:7px 10px}
.gate b{color:var(--warn)}
.from{display:flex; gap:8px; align-items:center; flex-wrap:wrap; font-size:13px}
.from select{border:1px solid var(--line); background:var(--surface); border-radius:7px; padding:3px 6px; font-size:13px}
.meter{height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; width:80px; display:inline-block; vertical-align:middle}
.meter i{display:block; height:100%; background:var(--good)}
.steer{border:1px dashed var(--line); border-radius:10px; padding:10px; display:flex; flex-direction:column; gap:8px}

/* checklists */
.checks{list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:6px}
.checks li{display:flex; gap:10px; align-items:center; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--surface)}
.checks li.done{background:var(--good-soft); border-color:transparent}
.checks li.locked{opacity:.55}
.checks li .t{flex:1; min-width:0; font-size:13.5px; font-weight:600}
.checks li .t small{display:block; font-weight:400; color:var(--muted); font-size:12px}
.tick{width:22px; height:22px; border-radius:6px; border:2px solid var(--line); background:var(--surface); display:grid; place-items:center; cursor:pointer; flex:none; font-weight:800; color:var(--good)}
li.done .tick{border-color:var(--good); background:var(--good); color:var(--surface)}
.tick:disabled{cursor:not-allowed}

/* toast */
.toasts{position:fixed; left:50%; transform:translateX(-50%); top:calc(64px + env(safe-area-inset-top,0px)); z-index:80; display:flex; flex-direction:column; gap:8px; align-items:center; width:min(520px,calc(100vw - 32px))}
.toast{background:var(--ink); color:var(--surface); border-radius:11px; padding:10px 12px 10px 14px; display:flex; gap:12px; align-items:center; box-shadow:var(--shadow); font-size:14px; width:100%}
.toast .btn{background:transparent; color:var(--surface); border-color:rgba(255,255,255,.35)}
.toast span{flex:1}

/* tour */
.tour{position:fixed; right:calc(16px + env(safe-area-inset-right,0px)); bottom:calc(16px + env(safe-area-inset-bottom,0px)); z-index:70; width:min(330px,calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow)}
.tour-h{display:flex; align-items:center; gap:10px; padding:10px 12px; border-bottom:1px solid var(--line)}
.tour-h b{flex:1; font-size:13.5px}
.tour ol{list-style:none; margin:0; padding:8px; display:flex; flex-direction:column; gap:2px; max-height:min(52vh,420px); overflow-y:auto}
.tour li{display:grid; grid-template-columns:22px minmax(0,1fr) auto; gap:8px; align-items:center; padding:6px; border-radius:8px; font-size:13px}
.tour li .n{width:22px; height:22px; border-radius:50%; display:grid; place-items:center; font:700 11px var(--f-mono); background:var(--surface-2); color:var(--ink-2)}
.tour li.done .n{background:var(--good); color:var(--surface)}
.tour li.done .lbl{color:var(--muted); text-decoration:line-through}
.tour .prog{height:4px; background:var(--surface-2)} .tour .prog i{display:block; height:100%; background:var(--good)}

/* palette */
.pal{position:fixed; top:calc(70px + env(safe-area-inset-top,0px)); left:50%; transform:translateX(-50%); width:min(560px,calc(100vw - 32px)); background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); z-index:65; overflow:hidden}
.pal input{border:0; border-bottom:1px solid var(--line); width:100%; padding:14px 16px; font-size:16px; background:transparent}
.pal input:focus{outline:none}
.pal ul{list-style:none; margin:0; padding:6px; max-height:50vh; overflow-y:auto}
.pal li button{width:100%; text-align:left; border:0; background:transparent; padding:8px 10px; border-radius:8px; display:flex; gap:10px; align-items:center; cursor:pointer}
.pal li button:hover, .pal li button:focus{background:var(--surface-2)}

/* compare page */
.cmp{max-width:1180px; margin:0 auto; padding-block:32px 120px; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); display:flex; flex-direction:column; gap:30px}
.cmp h1{font-size:clamp(1.9rem,4.4vw,2.9rem); font-weight:800; letter-spacing:-.01em}
.cmp .lede{font-size:1.05rem; color:var(--ink-2); max-width:72ch}
.cmp h2{font-size:1.45rem; font-weight:800}
.vcards{display:grid; grid-template-columns:repeat(auto-fit,minmax(310px,1fr)); gap:14px}
.vc{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; min-width:0}
.vc .k{font:700 12px var(--f-mono); color:var(--primary); letter-spacing:.06em; text-transform:uppercase}
.vc h3{font-size:1.3rem; font-weight:800}
.vc ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:5px; font-size:14px}
.vc h4{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted)}
.mini{display:grid; grid-template-columns:86px minmax(0,1fr); gap:6px; background:var(--surface-2); border-radius:10px; padding:8px; height:132px}
.mini .mr{display:flex; flex-direction:column; gap:3px}
.mini .mr span{font-size:10.5px; font-weight:700; background:var(--surface); border-radius:5px; padding:2px 6px; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.mini .mr span.on{background:var(--primary); color:var(--primary-ink)}
.mini .mw{background:var(--surface); border-radius:6px; padding:6px; display:flex; gap:4px; overflow:hidden; min-width:0}
.mini .mw i{display:block; background:var(--surface-3); border-radius:4px}
.cmp table td{white-space:normal; vertical-align:top}
.cmp table td:first-child{font-weight:700; min-width:180px}
.cmp tbody tr{cursor:default} .cmp tbody tr:hover td{background:transparent}
.rate{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:14px}
.stars{display:flex; gap:4px}
.stars button{width:34px; height:34px; border-radius:8px; border:1px solid var(--line); background:var(--surface); cursor:pointer; font-weight:800; color:var(--muted)}

/* ---------- toasts ---------- */
function toast(msg, label, fn){
  var host = document.getElementById("toasts");
  var el = document.createElement("div"); el.className = "toast";
  el.innerHTML = '<span>'+esc(msg)+'</span>'+(label?'<button class="btn sm" type="button">'+esc(label)+'</button>':'')+'<button class="btn sm" type="button" aria-label="Dismiss">✕</button>';
  var btns = el.querySelectorAll("button");
  if (label) btns[0].addEventListener("click", function(){ el.remove(); fn(); });
  btns[btns.length-1].addEventListener("click", function(){ el.remove(); });
  host.appendChild(el); while (host.children.length>3) host.firstChild.remove();
  setTimeout(function(){ el.remove(); }, 6500);
}

var TOUR = [
  ["finds","Review the new search results"],["qualify","Shortlist two creators, reject one"],["contact","Confirm a creator's email"],
  ["first","Approve and send a first email"],["reply","Answer a reply while reading it"],["pitch","Pitch a ready creator to a brand"],
  ["deal","Move a deal from contracts to go-live"],["money","Invoice, report, pay, pitch the next deal"],["team","Check mailbox health and the team"]
];
var tourState = {a:{}, b:{}, c:{}}, tourOpen = true, tourAll = false;
function tourDone(v, id){ if (!tourState[v][id]){ tourState[v][id] = true; renderTour(); } }
function renderTour(){
  var el = document.getElementById("tour"), btn = document.getElementById("tourToggle");
  var v = current; if (v==="cmp"){ el.hidden = true; btn.hidden = true; return; }
  btn.hidden = tourOpen; el.hidden = !tourOpen;
  var st = tourState[v], n = TOUR.filter(function(t){ return st[t[0]]; }).length;
  var nextI = -1; TOUR.forEach(function(t,i){ if (nextI<0 && !st[t[0]]) nextI = i; });
  var shown = tourAll ? TOUR.map(function(t,i){ return i; }) : (nextI>=0 ? [nextI] : []);
  el.innerHTML = '<div class="tour-h"><b>Walk the A to Z · version '+v.toUpperCase()+'</b><span class="mono muted">'+n+'/9</span><button class="btn sm ghost" type="button" id="tourAll" aria-expanded="'+tourAll+'">'+(tourAll?'Less':'All 9')+'</button><button class="btn sm ghost" type="button" id="tourHide" aria-label="Hide the tour">✕</button></div><div class="prog"><i style="width:'+(n/9*100)+'%"></i></div><ol>'+
    (shown.length ? shown.map(function(i){ var t = TOUR[i]; return '<li class="'+(st[t[0]]?'done':'')+'"><span class="n">'+(st[t[0]]?'✓':i+1)+'</span><span class="lbl">'+esc(t[1])+'</span><button class="btn sm" type="button" data-tour="'+t[0]+'">Show me</button></li>'; }).join("") : '<li><span class="n">✓</span><span class="lbl">All nine done. Rate this version on Compare.</span><span></span></li>')+'</ol>';
}
document.getElementById("tour").addEventListener("click", function(e){
  if (e.target.closest("#tourHide")){ tourOpen = false; renderTour(); return; }
  if (e.target.closest("#tourAll")){ tourAll = !tourAll; renderTour(); return; }
  var b = e.target.closest("[data-tour]"); if (b && V[current] && V[current].tour) V[current].tour(b.getAttribute("data-tour"));
});
document.getElementById("tourToggle").addEventListener("click", function(){ tourOpen = true; renderTour(); });

function openDrawer(head, body){
  var o = document.getElementById("overlay");
  o.innerHTML = '<div class="scrim" data-close></div><section class="drawer" role="dialog" aria-modal="true" aria-label="Details"><div class="drawer-h">'+head+'<span class="sp"></span><button class="btn sm ghost" type="button" data-close aria-label="Close">✕</button></div><div class="drawer-b">'+body+'</div></section>';
  var f = o.querySelector(".drawer button, .drawer [tabindex]"); if (f) f.focus();
}
function closeOverlay(){ document.getElementById("overlay").innerHTML = ""; }
function palette(d, onPick){
  var o = document.getElementById("overlay");
  var items = d.creators.filter(function(c){ return c.stage!=="rejected"; }).map(function(c){ return {k:"creator", id:c.id, label:c.name+" "+c.handle, sub:"Creator · "+c.stage}; })
    .concat(d.brands.map(function(b){ return {k:"brand", id:b.id, label:b.name, sub:"Brand · "+b.sells}; }))
    .concat(d.deals.map(function(x){ return {k:"deal", id:x.id, label:brand(d,x.brand).name+" × "+creator(d,x.creator).handle, sub:"Deal · "+DEAL_FLOW[x.step].name}; }));
  function list(q){ q = (q||"").toLowerCase(); return items.filter(function(i){ return !q || i.label.toLowerCase().indexOf(q)>=0; }).slice(0,9).map(function(i){ return '<li><button type="button" data-k="'+i.k+'" data-id="'+i.id+'"><b>'+esc(i.label)+'</b><span class="muted">'+esc(i.sub)+'</span></button></li>'; }).join("") || '<li class="hint" style="padding:10px">Nothing matches.</li>'; }
  o.innerHTML = '<div class="scrim" data-close></div><div class="pal" role="dialog" aria-modal="true" aria-label="Find anything"><input id="palq" placeholder="Type a name, handle, brand or deal" autocomplete="off"><ul id="pall">'+list("")+'</ul></div>';
  var inp = o.querySelector("#palq"); inp.focus();
  inp.addEventListener("input", function(){ o.querySelector("#pall").innerHTML = list(inp.value); });
  o.querySelector("#pall").addEventListener("click", function(e){ var b = e.target.closest("button[data-k]"); if (!b) return; closeOverlay(); onPick(b.getAttribute("data-k"), b.getAttribute("data-id")); });
}
document.getElementById("overlay").addEventListener("click", function(e){ if (e.target.closest("[data-close]")) closeOverlay(); });
document.addEventListener("keydown", function(e){
  if (e.key==="Escape") closeOverlay();
  if ((e.ctrlKey||e.metaKey) && (e.key==="k"||e.key==="K") && V[current] && V[current].palette){ e.preventDefault(); V[current].palette(); }
  if (V[current] && V[current].key && !/INPUT|TEXTAREA|SELECT/.test((e.target.tagName||"")) && !e.target.isContentEditable && !document.getElementById("overlay").innerHTML) V[current].key(e);
});

/* ---------- shared actions: every version calls P.act first ---------- */
function act(v, ctx, a, el){
  var d = ctx.d, id = el.getAttribute("data-id");
  switch(a){
  case "palette": ctx.palette(); return true;
  case "from": return true;
  case "edit": {
    var card = el.closest(".draft"); var on = card.querySelector(".body").getAttribute("contenteditable")!=="true";
    card.querySelectorAll("[data-edit]").forEach(function(x){ x.setAttribute("contenteditable", on); });
    el.textContent = on ? "Done editing" : "Edit"; if (on) card.querySelector(".body").focus(); return true; }
  case "steer": { var s = el.closest(".draft").querySelector("[data-steer]"); s.hidden = !s.hidden; return true; }
  case "redraft": toast("Redrafting with your steer. It lands back here in a minute or two (example)."); el.closest("[data-steer]").hidden = true; return true;
  case "send": {
    var q = draft(d,id); if (!q) return true;
    var card2 = el.closest(".draft"); var subj = card2.querySelector(".subj").textContent, body = card2.querySelector(".body").textContent;
    var w = who(d,q), key = q.who; d.threads[key] = (d.threads[key]||[]).concat([{dir:"out", at:"19 Oct", text:body}]);
    d.drafts = d.drafts.filter(function(x){ return x.id!==id; });
    var m = mailbox(d); m.left = Math.max(0, m.left-1); d.sent++;
    if (q.kind==="first" || q.kind==="followup") { if (!q.brand) w.stage = "emailed"; }
    if (q.kind==="reply" && !q.brand) w.stage = "replied";
    if (q.kind==="pitch" || q.kind==="upsell") { var b = brand(d,q.who); if (b && b.status!=="won") b.status = "pitched"; }
    if (q.kind==="first") tourDone(v,"first"); if (q.kind==="reply") tourDone(v,"reply"); if (q.kind==="pitch") tourDone(v,"pitch"); if (q.kind==="upsell") tourDone(v,"money");
    ctx.render(); toast("Sent from "+d.from+" (example). "+(q.kind==="first"?"Follow-up 1 is due in 1 working day.":""), "Open conversation", function(){ ctx.openConversation(q.brand?"brand":"creator", q.who); });
    return true; }
  case "skip": d.drafts = d.drafts.filter(function(x){ return x.id!==id; }); ctx.render(); toast("Skipped. It comes back when something new happens.", "Undo", function(){}); return true;
  case "snooze": d.drafts = d.drafts.filter(function(x){ return x.id!==id; }); ctx.render(); toast("Snoozed until 21 Oct."); return true;
  case "never": { var q2 = draft(d,id); d.drafts = d.drafts.filter(function(x){ return x.id!==id; }); var c0 = creator(d,q2.who); if (c0) c0.stage = "rejected"; ctx.render(); toast(c0.handle+" will not be contacted again."); return true; }
  case "confirm": { var c = creator(d,id); if (c){ c.confirmed = true; tourDone(v,"contact"); ctx.render(); toast(c.email+" confirmed as "+c.handle+"'s address."); } return true; }
  case "find-email": { var c2 = creator(d,id); c2.email = c2.handle.slice(1)+"@gmail.com"; c2.confirmed = false; ctx.render(); toast("Found "+c2.email+" in the channel's About page. Confirm it before the first email."); return true; }
  case "check": {
    var dl = deal(d,id), i = +el.getAttribute("data-i"); dl.checks[i] = !dl.checks[i];
    if (!dl.checks[i]) for (var j=i+1;j<dl.checks.length;j++) dl.checks[j] = false;
    if (dl.step===DEAL_FLOW.length-1 && dl.checks[0]) tourDone(v,"money");
    ctx.render(); return true; }
  case "next-step": {
    var dl2 = deal(d,id); if (dl2.step>=DEAL_FLOW.length-1) return true;
    ctx.dealStart = ctx.dealStart || {}; if (ctx.dealStart[id]===undefined) ctx.dealStart[id] = dl2.step;
    dl2.step++; dl2.checks = DEAL_FLOW[dl2.step].items.map(function(){ return false; });
    if (dl2.step===6) dl2.invoiceDue = day(30);
    if (ctx.dealStart[id]<=1 && dl2.step>=5) tourDone(v,"deal");
    ctx.render(); toast(dealLine(d,dl2).replace(/&amp;/g,"&")+" moved to "+DEAL_FLOW[dl2.step].name+"."); return true; }
  case "upsell": {
    var dl3 = deal(d,id), c3 = creator(d,el.getAttribute("data-c")), b3 = brand(d,dl3.brand);
    d.drafts.unshift({id:"u"+Date.now(), kind:"upsell", who:b3.id, brand:true, subject:c3.name+" for "+b3.name+"'s next push", body:"Hi "+b3.contact.split(" ")[0]+",\n\nGlad the last video landed: "+fmtK(dl3.views||90000)+" views in 30 days. "+c3.name+" ("+fmtK(c3.median)+" median views, "+c3.top.split("·")[0].trim()+") covers the same audience and has a slot next month. Want the details?", why:"Results are in and good, so pitch the brand its next creator.", lessons:["BRD-UPSELL-02"], gates:[], age:"now"});
    if (dl3.step===DEAL_FLOW.length-1) dl3.checks[0] = true;
    tourDone(v,"money"); ctx.render(); toast("Pitch to "+b3.name+" drafted. It is in your queue.", "Open it", function(){ ctx.openQueue(); }); return true; }
  case "sign": { var c4 = creator(d,id); c4.stage = "signed"; ctx.render(); toast(c4.handle+" signed. They now show as ready to pitch."); return true; }
  case "assign": { toast("Assigned (example)."); return true; }
  }
  return false;
}
function shortlist(v, d, ids){ ids.forEach(function(id){ var c = creator(d,id); if (c){ c.stage = "shortlisted"; c.owner = c.owner || "You"; } }); d.session.shortlisted += ids.length; if (d.session.shortlisted>=2 && d.session.rejected>=1) tourDone(v,"qualify"); }
function reject(v, d, ids){ ids.forEach(function(id){ var c = creator(d,id); if (c) c.stage = "rejected"; }); d.session.rejected += ids.length; if (d.session.shortlisted>=2 && d.session.rejected>=1) tourDone(v,"qualify"); }
function draftPitch(v, d, bid, cids){
  var b = brand(d,bid), cs = cids.map(function(id){ return creator(d,id); });
  d.drafts.unshift({id:"p"+Date.now(), kind:"pitch", who:b.id, brand:true, subject:cs.map(function(c){ return c.name; }).join(" and ")+" for "+b.name, body:"Hi "+(b.contact||"there").split(" ")[0]+",\n\n"+cs.map(function(c){ return c.name+" ("+fmtK(c.median)+" median views, "+c.top.split("·")[0].trim()+") just posted \""+c.video+"\"."; }).join("\n")+"\n\nBoth audiences are the people who buy "+b.sells+". Want their rates and dates for next month?", why:"Pitch 1–2 signed creators with one key fact each and one easy question.", lessons:["BRD-PITCH-03","HC-14"], gates:[], age:"now"});
  if (b.status==="found"||b.status==="qualified") b.status = "qualified";
}

var V = {}, current = "cmp";
function register(k, impl){ V[k] = impl; }
function go(k){
  current = k;
  document.querySelectorAll("#vt button").forEach(function(b){ b.setAttribute("aria-current", b.getAttribute("data-v")===k); });
  closeOverlay();
  var stage = document.getElementById("stage");
  if (k==="cmp") window.CMP.render(stage); else if (V[k]) V[k].mount(stage); else stage.innerHTML = '<div class="cmp"><p>This version did not load.</p></div>';
  renderTour(); window.scrollTo(0,0);
  try { localStorage.setItem("gp-v", k); } catch(e){}
  if (location.hash.slice(1)!==k) history.replaceState(null, "", "#"+k);
}
document.getElementById("vt").addEventListener("click", function(e){ var b = e.target.closest("[data-v]"); if (b) go(b.getAttribute("data-v")); });

return {seed:seed, esc:esc, fmtK:fmtK, money:money, day:day, avatar:avatar, CREATOR_STEPS:CREATOR_STEPS, STAGE_STEP:STAGE_STEP, DEAL_FLOW:DEAL_FLOW, KIND:KIND,
  creator:creator, brand:brand, deal:deal, draft:draft, who:who, ready:ready, topOk:topOk, mailbox:mailbox, makeFirst:makeFirst,
  statusPills:statusPills, searchBox:searchBox, fromPicker:fromPicker, journey:journey, threadHtml:threadHtml, draftCard:draftCard, signals:signals, statsKv:statsKv,
  audienceCheck:audienceCheck, contactsBlock:contactsBlock, dealChecklist:dealChecklist, dealLine:dealLine, nextAction:nextAction,
  toast:toast, tourDone:tourDone, openDrawer:openDrawer, closeOverlay:closeOverlay, palette:palette, act:act, shortlist:shortlist, reject:reject, draftPitch:draftPitch,
  register:register, go:go, get current(){ return current; }};
})();
</script>

<script>
/* ===================== the Compare page ===================== */
window.CMP = (function(){
"use strict";
var esc = P.esc;
var ROWS = [
  ["A finished search leads nowhere","Search ends with \"Review 38 new channels\" into the Qualify table","\"Review new finds\" sits in Today as one-at-a-time triage","A saved view \"New finds\" opens the list, filtered"],
  ["Qualifying needs right-click and long profiles","Table with signal columns, checkboxes and a bulk bar; details in a side drawer","One big card per channel: Shortlist (S), Reject (R), Skip (→); a table view for bulk","List with signals plus a record page with tabs and a \"Next step\" button"],
  ["Comms queue cut off from the creator","Board card opens a drawer with the conversation and the draft together","The work panel shows their message, then the draft, side by side with the record","The inbox thread shows the history with the draft pinned underneath"],
  ["No mailbox picker, cap hidden","\"From\" picker with today's count on every draft","Same, plus the daily target in the top bar","Same"],
  ["Nothing says what to do next","Counts on each phase; every card names its next action","The whole app opens on the next action, then advances by itself","Every record shows its journey and one \"Next step\" button"],
  ["Brand conversations invisible","Brands board; brand drawer holds the conversation","Brand replies are Today items like any other","Inbox mixes creators and brands; the brand record has the thread"],
  ["Campaigns four clicks deep","Close › Pitches: pick a brand, tick 1–2 ready creators, draft","A \"Pitch\" item appears when a brand is qualified","Campaigns get their own sidebar item; pitch from the brand record"],
  ["Deal stages jump freely","Deliver board: one column per step, cards move only when the checklist is done","Each step's checklist arrives as a Today item","Deal journey bar with a guarded checklist"],
  ["No brief, pre-live, go-live, invoice or upsell","Checklist items for each, with the go-live email and Net 30 due date","Same checklists, surfaced on the day they are due","Same checklists inside the deal record"],
  ["No global search","Ctrl K finds any creator, brand or deal","Ctrl K","Ctrl K, plus saved views"],
  ["Gemini, Python, Gmail, sync status hidden","Status pills in the top bar","Status pills in the top bar","Status pills in the top bar"],
  ["Team and VA work unclear","Team phase: my work, scorecard, mailbox health","Today is per person; a VA sees only their items","\"Mine\" saved view on every list; Team page"]
];
var KEEP = [
  ["Search console","Your keyword box, Gemini keyword generator and live progress, with the rules always on screen.",["Keyword list with done, current and per-keyword yield; Start here, Redo, Remove","Teammates searching now, with Send keywords","Rules editor inline, with the house-rule preset and country chips","Progress, counters, live log and the background tabs","Every run ends with \"Review results\" into the gallery"]],
  ["Creator gallery","Your picture view of influencers with the latest upload, made faster to filter and act on.",["Banner, avatar and latest-upload thumbnail on every card","Filter sidebar with live counts: stage, signals, top-3 country, views, uploads, owner, search run","Sort, card size, toggles for pictures, latest upload and signals","Quick-tag brush: click cards to shortlist, reject or assign","Multi-select with a bulk bar, saved views, and a table view"]],
  ["Channel analytics","Your analytics section, with the same filters, tiles and charts.",["Filter bar: country, stage, tag, subscriber and median-view ranges, uploads","Tiles: channels, median vs mean subscribers, reach, found and uploads this month, median views, deals","Subscriber and median-view distributions split into Live, Archive due and Archived","Countries, stages, tags, found per month; click any bar to open those channels","Keyword evaluation by median-view tier, with a tier-weighted score and More like this"]],
  ["Toolbox","Everything else you need on hand, in one place instead of scattered across Settings and pop-ups.",["Price calculator (CPM ranges by niche, markup, margin)","Archive with a clear Bring back","Scheduled emails, edit conflicts, activity log, notifications","Writing rules, agency facts, 30-day report","Setup health for Gemini, Python, Gmail, AWS, sync and updates"]]
];
var CARDS = [
  {k:"a", name:"Pipeline", idea:"The sidebar is your framework. Five phases, each with its steps as tabs, and boards that show where every creator, brand and deal stands.", day:"Open Find, clear new finds; switch to Reach out, approve the drafted column; jump to Deliver and push each deal card one step.", good:["Mirrors the IMA framework exactly, so training is easy","See the whole pipeline at a glance","Bulk work is natural in tables and boards"], risk:["You decide what to do next by scanning boards","Five phases plus tabs is more navigation than B"], rail:["Find","Reach out","Close","Deliver","Team"], cols:5},
  {k:"b", name:"Today", idea:"The app opens on one list of next actions for you: replies to answer, drafts to approve, finds to triage, deal steps due. Records are there for lookups.", day:"Press Start and work down the list. Each item opens what you need for it, and the next one opens when you finish.", good:["Least thinking for a worker or a VA","Fast keyboard triage (S, R, arrows)","Fits the 4 focused hours a day"], risk:["Harder to see the big picture","Depends on the queue being right"], rail:["Today","Creators","Brands","Deals","Team"], cols:1},
  {k:"c", name:"Records", idea:"A classic CRM: lists of creators, brands, deals and conversations, with a record page that shows its journey and the one next step.", day:"Open a saved view (New finds, Waiting, Ready to pitch, Mine), work through records, answer conversations in a unified inbox.", good:["Familiar to anyone who used a CRM","Everything about one creator or deal in one place","Saved views replace scattered filters"], risk:["Workers must remember which view to open","Closest to today's app, so less change"], rail:["Inbox","Creators","Brands","Deals","Campaigns","Team"], cols:3}
];
function mini(c){
  var w = c.cols===5 ? '<i style="flex:1"></i><i style="flex:1"></i><i style="flex:1"></i><i style="flex:1"></i><i style="flex:1"></i>' : c.cols===1 ? '<i style="flex:1"></i><i style="flex:1.4; background:var(--primary-soft)"></i>' : '<i style="flex:.8"></i><i style="flex:1.4"></i><i style="flex:.7"></i>';
  return '<div class="mini" aria-hidden="true"><div class="mr">'+c.rail.map(function(r,i){ return '<span class="'+(i===0?'on':'')+'">'+esc(r)+'</span>'; }).join("")+'</div><div class="mw">'+w+'</div></div>';
}
var ratings = {}, db = null, canWrite = false, timers = {};
function render(stage){
  stage.innerHTML = '<div class="cmp">'+
   '<div class="col" style="gap:12px"><h1>Three ways to organize the Gratovo app</h1><p class="lede">The same features and the same example data, laid out three ways. Each version fixes the problems from your UI map; they differ in how a worker moves through the day. Open each one, walk the nine-stop tour in the corner (search results to upsell), then rate them below.</p></div>'+
   '<div class="vcards">'+CARDS.map(function(c){ return '<article class="vc"><span class="k">Version '+c.k.toUpperCase()+'</span><h3>'+esc(c.name)+'</h3>'+mini(c)+'<p>'+esc(c.idea)+'</p><h4>A worker\'s day</h4><p class="ink2">'+esc(c.day)+'</p><h4>Strengths</h4><ul>'+c.good.map(function(g){ return '<li>'+esc(g)+'</li>'; }).join("")+'</ul><h4>Risks</h4><ul>'+c.risk.map(function(g){ return '<li>'+esc(g)+'</li>'; }).join("")+'</ul><button class="btn pri" type="button" data-open="'+c.k+'">Open version '+c.k.toUpperCase()+'</button></article>'; }).join("")+'</div>'+
   '<div class="col" style="gap:12px"><h2>How each fixes the problems on your map</h2><div class="tw"><table><thead><tr><th>Problem today</th><th>A · Pipeline</th><th>B · Today</th><th>C · Records</th></tr></thead><tbody>'+ROWS.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td>'+esc(r[1])+'</td><td>'+esc(r[2])+'</td><td>'+esc(r[3])+'</td></tr>'; }).join("")+'</tbody></table></div>'+
   '</div><div class="col" style="gap:12px"><h2>Kept from your current app, rebuilt for every version</h2><div class="vcards">'+KEEP.map(function(k){ return '<article class="vc"><h3 style="font-size:1.1rem">'+esc(k[0])+'</h3><p class="ink2">'+esc(k[1])+'</p><ul>'+k[2].map(function(x){ return '<li>'+esc(x)+'</li>'; }).join("")+'</ul></article>'; }).join("")+'</div>'+
   '<p class="hint">All three share the same fixes underneath: one send path with checks, a mailbox picker, confirmable emails, guarded deal steps, a go-live email, a Net 30 due date and an upsell action. A mix is possible too, for example B\'s Today as the home screen with C\'s records behind it.</p></div>'+
   '<div class="col" style="gap:12px"><h2>Your verdict</h2><p class="ink2" id="saveNote">Loading your saved ratings…</p><div class="rate">'+CARDS.map(function(c){ return '<div class="card"><h3>'+c.k.toUpperCase()+' · '+esc(c.name)+'</h3><div class="stars" role="group" aria-label="Rate version '+c.k.toUpperCase()+'">'+[1,2,3,4,5].map(function(n){ return '<button type="button" data-rate="'+c.k+'" data-n="'+n+'" aria-pressed="false" disabled>'+n+'</button>'; }).join("")+'</div><label class="field" for="note-'+c.k+'">What works, what doesn\'t</label><textarea class="input" id="note-'+c.k+'" data-note="'+c.k+'" disabled></textarea><span class="state" id="state-'+c.k+'"></span></div>'; }).join("")+'</div>'+
   '<div class="card"><h3>My pick</h3><div class="pick" role="group" aria-label="Pick a version">'+["a","b","c","mix"].map(function(k){ return '<button class="chip" type="button" data-pick="'+k+'" aria-pressed="false" disabled>'+(k==="mix"?"A mix":"Version "+k.toUpperCase())+'</button>'; }).join("")+'</div><span class="state" id="state-pick"></span></div></div>'+
  '</div>';
  paintAll(); if (db) unlock();
}
function paintAll(){
  ["a","b","c"].forEach(function(k){
    var r = ratings[k]||{};
    document.querySelectorAll('[data-rate="'+k+'"]').forEach(function(b){ b.setAttribute("aria-pressed", +b.getAttribute("data-n")<=(r.score||0)); });
    var ta = document.getElementById("note-"+k); if (ta && document.activeElement!==ta && !timers[k]) ta.value = r.note||"";
  });
  var p = (ratings.pick||{}).pick;
  document.querySelectorAll("[data-pick]").forEach(function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-pick")===p); });
}
function setState(k, t, cls){ var el = document.getElementById("state-"+k); if (el){ el.textContent = t; el.style.color = cls==="err" ? "var(--crit)" : ""; } }
function save(k, patch){
  if (!db || !canWrite) return;
  var body = Object.assign({}, ratings[k]||{}, patch, {version:k, updatedAt:new Date().toISOString()});
  ratings[k] = body; paintAll(); setState(k, "Saving…");
  db.doc("verdict/"+k).set(JSON.parse(JSON.stringify(body))).then(function(){ setState(k, "Saved"); }, function(e){ setState(k, "Not saved: "+((e&&e.message)||"try again"), "err"); });
}
function unlock(){
  canWrite = true;
  document.querySelectorAll("[data-rate],[data-note],[data-pick]").forEach(function(x){ x.disabled = false; });
  var n = document.getElementById("saveNote"); if (n) n.textContent = "Ratings and notes save to this page as you go.";
}
function lock(msg){ var n = document.getElementById("saveNote"); if (n) n.textContent = msg; }
document.addEventListener("click", function(e){
  if (P.current!=="cmp") return;
  var o = e.target.closest("[data-open]"); if (o){ P.go(o.getAttribute("data-open")); return; }
  var r = e.target.closest("[data-rate]"); if (r && !r.disabled){ save(r.getAttribute("data-rate"), {score:+r.getAttribute("data-n")}); return; }
  var p = e.target.closest("[data-pick]"); if (p && !p.disabled){ save("pick", {pick:p.getAttribute("data-pick")}); }
});
document.addEventListener("input", function(e){
  if (!e.target.matches || !e.target.matches("[data-note]")) return;
  var k = e.target.getAttribute("data-note"); clearTimeout(timers[k]); setState(k, "Typing…");
  timers[k] = setTimeout(function(){ timers[k] = null; save(k, {note:e.target.value}); }, 1000);
});
(window.claude && window.claude.use ? window.claude.use("db") : Promise.resolve(null)).then(function(h){
  if (!h){ lock("Ratings can't be saved in this view. Open the page on claude.ai while signed in."); return; }
  db = h; if (P.current==="cmp") unlock();
  db.collection("verdict").onSnapshot(function(snap){ snap.docs.forEach(function(doc){ if (doc.exists && !timers[doc.id]) ratings[doc.id] = doc.data(); }); if (P.current==="cmp") paintAll(); });
}, function(){ lock("Ratings can't be saved in this view."); });
return {render:render};
})();
</script>
