# Lint, typecheck, unit tests and the Electron end-to-end tests on Windows, the only system the
# app supports, a secret scan of the whole history, a dependency audit, CodeQL and the SQL tests.
# Actions are pinned by commit, with their release beside each one.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  # Once a week, so new advisories surface even when nobody pushes.
  schedule:
    - cron: "23 5 * * 1"

permissions:
  contents: read

# A new push to a pull request cancels its older run. Runs on main always finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # A uv.lock that doesn't match pyproject.toml fails the run instead of being rewritten.
  UV_LOCKED: "1"

jobs:
  checks:
    name: Checks (Windows)
    # The weekly run is for new advisories only; nothing here changes without a push.
    if: github.event_name != 'schedule'
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Installs the pnpm version named in package.json's packageManager.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1"
          enable-cache: true
          cache-dependency-glob: services/pipeline/uv.lock

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: End-to-end tests
        run: pnpm test:e2e

      - name: Keep the end-to-end results
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-results
          path: apps/desktop/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # Tests the shared database (Postgres in Docker), not the app, so it uses the Linux runner. It
  # has nothing to do with which systems the app supports.
  sql:
    name: SQL tests (Linux, Docker)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Run the SQL tests
        run: node supabase/tests/run.ts

  # Tests the server, not the app: a throwaway Supabase stack in Docker (real Auth, the database
  # with the migrations, and the r2-access function) and the app's own sign-in code run against it.
  # It has nothing to do with which systems the app supports, so it uses the Linux runner. The
  # stack's keys are the Supabase CLI's fixed local defaults, which `supabase start` prints before the
  # masking step runs: throwaway values that open nothing but this job's stack, never the team's
  # project. They are still masked from then on and live only in this job's environment.
  # Studio, the mail server, Storage, Realtime and the rest are left out to keep the start short.
  server:
    name: Server tests (Linux, local Supabase)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.119.0

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Start the local stack
        run: supabase start -x studio,mailpit,storage-api,imgproxy,logflare,vector,supavisor,realtime,postgres-meta

      - name: Pass the stack's keys to the tests
        run: |
          supabase status -o env > "$RUNNER_TEMP/stack.env"
          # Mask every value before anything can print it, then export under the tests' names.
          while IFS='=' read -r name value; do
            value="${value%\"}"
            value="${value#\"}"
            case "$name" in API_URL|PUBLISHABLE_KEY|SECRET_KEY|ANON_KEY|SERVICE_ROLE_KEY|JWT_SECRET)
              echo "::add-mask::$value" ;;
            esac
          done < "$RUNNER_TEMP/stack.env"
          . "$RUNNER_TEMP/stack.env"
          {
            echo "SUPABASE_URL=$API_URL"
            echo "SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
          } >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/stack.env"

      - name: Run the server tests
        run: pnpm test:server

      - name: Stop the stack
        if: always()
        run: supabase stop --no-backup

  # The three analysis jobs (secret scan, dependency audit, CodeQL) only read files and never run
  # the app, so they use the quicker Linux runner. It has nothing to do with which systems the app
  # supports. Windows minutes also count double on a private repository.
  secrets:
    name: Secret scan
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      # Built from source at a pinned release. Go's checksum database verifies what is downloaded.
      - name: Install gitleaks
        run: go install github.com/zricethezav/gitleaks/v8@v8.30.1

      # Known false positives are listed, by fingerprint, in .gitleaksignore.
      - name: Scan every commit
        run: '"$(go env GOPATH)/bin/gitleaks" git --redact --no-banner --verbose'

  # Fails on any known vulnerability in the two lockfiles. To ignore a reviewed false positive,
  # add an osv-scanner.toml next to the lockfile it applies to (the root for pnpm-lock.yaml,
  # services/pipeline/ for uv.lock) with an [[IgnoredVulns]] entry: an id, an ignoreUntil date and a
  # reason. Only these two lockfiles are scanned: legacy/ holds the old app's, for reference.
  audit:
    name: Dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.2"
          cache: false

      # Built from source at a pinned release. Go's checksum database verifies what is downloaded.
      - name: Install OSV-Scanner
        run: go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.0

      - name: Scan the lockfiles
        run: >-
          "$(go env GOPATH)/bin/osv-scanner" scan source
          --lockfile pnpm-lock.yaml
          --lockfile services/pipeline/uv.lock

  # The repository has no GitHub Advanced Security, so results can't go to code scanning
  # (upload: never). The last step reads the report and fails the job on any result instead. The
  # action's warning that code scanning isn't enabled is expected for the same reason.
  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, python]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          category: "/language:${{ matrix.language }}"
          upload: never
          output: ${{ runner.temp }}/codeql

      - name: Fail on any finding
        env:
          CODEQL_OUT: ${{ runner.temp }}/codeql
        run: |
          shopt -s nullglob
          files=("$CODEQL_OUT"/*.sarif)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No SARIF report found in $CODEQL_OUT" >&2
            exit 1
          fi
          total=0
          for f in "${files[@]}"; do
            jq -r '.runs[].results[]? | "\(.ruleId): \(.message.text) (\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine))"' "$f"
            n=$(jq '[.runs[].results[]?] | length' "$f")
            total=$((total + n))
          done
          if [ "$total" -gt 0 ]; then
            echo "CodeQL found $total result(s)." >&2
            exit 1
          fi
