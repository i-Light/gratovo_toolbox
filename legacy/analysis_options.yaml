include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    # Generated by `flutter gen-l10n` from lib/l10n/*.arb — regenerated on
    # every `flutter pub get`/`flutter run`, so it's pointless to lint or
    # hand-edit.
    - lib/l10n/gen/**

linter:
  rules:
    # Catches an async call started and never awaited/handled — the exact
    # bug class the fire-and-forget `_loadPersisted()` calls in
    # theme_provider.dart / locale_provider.dart would be if they weren't
    # explicitly wrapped in `unawaited(...)`.
    - unawaited_futures
    - prefer_const_constructors
    - prefer_const_constructors_in_immutables
    - prefer_const_declarations
    - prefer_final_locals
    - avoid_print
    - use_super_parameters

    # Consistency rules that were already true of nearly all the code; the
    # handful of stragglers were fixed when these were switched on.
    - prefer_single_quotes
    - unnecessary_raw_strings
    - unnecessary_parenthesis
    - unnecessary_lambdas
    - unnecessary_this
    - unnecessary_null_checks
    - unnecessary_breaks
    - unnecessary_statements
    - unnecessary_await_in_return
    - prefer_const_literals_to_create_immutables
    - prefer_final_in_for_each
    - prefer_null_aware_method_calls
    - use_if_null_to_convert_nulls_to_bools
    - avoid_bool_literals_in_conditional_expressions
    - avoid_multiple_declarations_per_line
    - avoid_unused_constructor_parameters
    - use_string_buffers
    # Two bug classes this codebase actually hits: a StreamSubscription with
    # no cancel, and a `void` async method whose failures nobody can await.
    - cancel_subscriptions
    - avoid_void_async
    - throw_in_finally
    # Imports sorted dart:/package:/relative, each block alphabetical -- what
    # `dart fix` produces, so a diff never argues about import order.
    - directives_ordering
