[project]
name = "gratovo-pipeline"
version = "0.0.0"
description = "Gratovo's Python pipeline: YouTube search and enrichment, R2, Gmail and the comms engine."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
  # The vendored scrapetube impersonates a browser's TLS handshake through it.
  "curl-cffi==0.16.3",
]

[dependency-groups]
dev = [
  # Checks every message the tests capture against protocol.schema.json.
  "jsonschema==4.26.0",
  # The nodejs extra brings its own Node, so pyright doesn't download one on first run.
  "pyright[nodejs]==1.1.414",
  "pytest==9.1.1",
  "ruff==0.17.1",
  "types-jsonschema==4.26.0.20261006",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14"]
build-backend = "uv_build"

[tool.uv]
required-version = ">=0.13.1"

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "W",   # pycodestyle warnings
  "F",   # pyflakes
  "I",   # import order
  "N",   # naming
  "UP",  # modern syntax
  "B",   # likely bugs
  "S",   # security
  "C4",  # comprehensions
  "SIM", # simpler code
  "PTH", # pathlib over os.path
  "PT",  # pytest style
  "RET", # returns
  "RUF", # ruff's own rules
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # pytest asserts
# The store builds SQL from ? placeholders and fixed clauses only; every value is a parameter.
"src/gratovo_pipeline/store.py" = ["S608"]
# Its word lists read best as space-separated words.
"src/gratovo_pipeline/found_emails.py" = ["SIM905"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest]
testpaths = ["tests"]
strict = true
addopts = ["-ra"]
